name: Browser smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-smoke:
    name: Playwright browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        timeout-minutes: 10
        run: |
          python -m pip install --no-input "playwright==1.65.2"
          python -m playwright install --with-deps --no-shell chromium

      - name: Point GUANYE_TEST_EDGE at Playwright Chromium
        timeout-minutes: 2
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser_path = Path(playwright.chromium.executable_path)
          if not browser_path.is_file():
              raise SystemExit(f"Playwright Chromium executable is missing: {browser_path}")
          print(f"GUANYE_TEST_EDGE={browser_path}")
          PY

      - name: Run six browser test modules
        timeout-minutes: 15
        run: |
          python - <<'PY'
          from collections import Counter
          import unittest

          modules = [
              "test_ai_generation_browser",
              "test_ai_pages_gateway_browser",
              "test_ai_planning_browser",
              "test_ai_reviews_browser",
              "test_ai_reviews_preview_browser",
              "test_library_classification_browser",
          ]
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromNames(modules)

          if loader.errors:
              raise SystemExit("\n".join(loader.errors))

          def iter_tests(item):
              if isinstance(item, unittest.TestSuite):
                  for child in item:
                      yield from iter_tests(child)
              else:
                  yield item

          tests = list(iter_tests(suite))
          counts = Counter(test.id().split(".", 1)[0] for test in tests)
          module_counts = {module: counts[module] for module in modules}
          empty_modules = [module for module, count in module_counts.items() if count == 0]
          if empty_modules:
              raise SystemExit(f"No tests discovered in modules: {empty_modules}")

          print(f"Loaded {len(tests)} tests from {len(modules)} modules")
          print(f"Module test counts: {module_counts}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)

          if result.skipped:
              details = "\n".join(f"{test}: {reason}" for test, reason in result.skipped)
              raise SystemExit(f"Browser tests were skipped:\n{details}")
          if not result.wasSuccessful():
              raise SystemExit(1)

          print(
              f"PASS: {result.testsRun} tests ran across {len(module_counts)} modules; "
              "zero skips"
          )
          PY
