name: guanye-staging

x-guanye-service: &guanye-service
  image: guanye-ai-gateway:staging
  build:
    context: ..
    dockerfile: cloud/Dockerfile
    args:
      GUANYE_PYTHON_IMAGE: "${GUANYE_PYTHON_IMAGE:-python:3.12-slim-bookworm}"
      GUANYE_PIP_INDEX_URL: "${GUANYE_PIP_INDEX_URL:-https://pypi.org/simple}"
  user: "10001:10001"
  init: true
  restart: unless-stopped
  env_file:
    - path: ./private-gateway.env
      required: false
  environment:
    GUANYE_HOST: "0.0.0.0"
    GUANYE_PORT: "8787"
  security_opt:
    - no-new-privileges:true

services:
  gateway:
    <<: *guanye-service
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3); raise SystemExit(0 if response.status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  review-worker:
    <<: *guanye-service
    stop_grace_period: 5m
    command: ["--review-worker"]
